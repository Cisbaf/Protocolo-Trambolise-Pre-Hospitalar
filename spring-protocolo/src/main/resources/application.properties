spring.application.name=ViteProtocolo

spring.jpa.hibernate.ddl-auto=update

# Perfil padrao quando nada e' informado. A imagem de producao define
# SPRING_PROFILES_ACTIVE=prod no Dockerfile, o que tem precedencia.
spring.profiles.default=${PROFILE_ACTIVE:dev}

logging.logback.rollingpolicy.max-file-size=30MB

jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:3600000}

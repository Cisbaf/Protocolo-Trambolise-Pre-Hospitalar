# ==========================================================
# Perfil de DESENVOLVIMENTO.
#
# Mesma estrutura do application-prod.properties: tudo vem de
# variavel de ambiente (.env), so que aqui existem defaults
# para rodar sem nenhuma configuracao previa.
# Nao coloque credencial real neste arquivo - ele e' versionado.
# ==========================================================

spring.datasource.url=${DB_PROTOCOL_URL:jdbc:mysql://localhost:3306/protocolo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_PROTOCOL_USER:root}
spring.datasource.password=${DB_PROTOCOL_PASSWORD:rootpass}

logging.file.name=${LOG_PROTOCOL_PATH:logs/logs-protocolo.txt}

jwt.secret=${JWT_SECRET:devSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm1234567890123456789012}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Hot reload. Nao altera o comportamento da aplicacao, so recarrega o contexto.
spring.devtools.restart.enabled=true

# ATENCAO: nao desligue o open-in-view aqui.
# As colecoes @ElementCollection (historia.doencas, historia.medicamentos,
# parecerFinal.motivos) sao LAZY e so sao serializadas porque a sessao segue
# aberta na renderizacao. Com open-in-view=false o GET /protocolo quebra em dev
# e passa em producao - exatamente o tipo de divergencia que queremos evitar.
